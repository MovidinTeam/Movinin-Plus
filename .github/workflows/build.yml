name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    strategy:
      matrix:
        node-version: [20.x]   # ← Cambiado de 18.x a 20.x (Vite lo requiere)

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        
    - name: Build backend server
      env:
        MI_SMTP_HOST: smtp.gmail.com
        MI_SMTP_PORT: "587"
        MI_SMTP_USER: test
        MI_SMTP_PASS: test
        MI_SMTP_FROM: test@test.com
        MI_DB_URI: mongodb://localhost:27017/movinin
        MI_JWT_SECRET: supersecret
        MI_JWT_EXPIRE: 86400
        MI_TOKEN_EXPIRE: 86400
        MI_CDN_UPLOAD_DIR: /tmp
        MI_CDN_TEMP_FOLDER: temp
      run: |
        cd ./backend
        npm install
        npm run lint
        npm test

    - name: Build admin panel
      run: |
        cd ./admin
        npm install --force
        npm run lint
        npm run build

    - name: Build frontend
      run: |
        cd ./frontend
        npm install --force
        npm run lint
        npm run build

    - name: Build mobile app
      run: |
        cd ./mobile
        npm install
        npm run lint
        npm run ts:check

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./frontend/dist   # ajusta esta ruta si es diferente
