name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        node-version: [lts/*]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        
    - name: Build backend server
      run: |
           cd ./backend
           echo "MI_SMTP_HOST=smtp.gmail.com" > .env
           echo "MI_SMTP_PORT=587" >> .env
           echo "MI_SMTP_USER=test" >> .env
           echo "MI_SMTP_PASS=test" >> .env
           echo "DB_URI=mongodb://localhost:27017/test" >> .env
           echo "JWT_SECRET=supersecret" >> .env
           npm install
           npm run lint
           npm run build

    - name: Build admin panel
      run: |
           cd ./admin
           npm install --force
           npm run lint
           npm run build

    - name: Build frontend
      run: |
           cd ./frontend
           npm install --force
           npm run lint
           npm run build

    - name: Build mobile app
      run: |
           cd ./mobile
           npm install
           npm run lint
           npm run ts:check
